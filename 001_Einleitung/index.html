<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Digitale Tragwerksplanung | 001_Einführung </title>

  <!-- Reveal.js core -->
  <link rel="stylesheet" href="https://unpkg.com/reveal.js@6.0.1/dist/reveal.css">

  <!-- Reveal.js theme -->
  <link rel="stylesheet" href="https://unpkg.com/reveal.js@6.0.1/dist/theme/white.css" id="theme">

  <!-- Code highlighting -->
  <link rel="stylesheet" href="https://unpkg.com/reveal.js@6.0.1/dist/plugin/highlight/monokai.css">

  <style>
    .reveal .slides {
      padding-top: 10px;
      padding-bottom: 10px;
    }

    .reveal figcaption,
    .reveal .attribution {
      font-size: 0.52em;
      opacity: 0.68;
    }

    .reveal .small { font-size: 0.70em; }
    .reveal .tiny { font-size: 0.54em; }
    .reveal .muted { opacity: 0.68; }
    .reveal .accent { color: #1769aa; }

    .reveal .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.15em;
      align-items: start;
      text-align: left;
    }

    .reveal .three-col {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75em;
      align-items: stretch;
    }

    .reveal .four-col {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.55em;
      align-items: stretch;
    }

    .reveal .card {
      border: 1px solid #d7d7d7;
      border-radius: 12px;
      padding: 0.65em 0.8em;
      background: #fafafa;
    }

    .reveal .card h3,
    .reveal .card h4 {
      margin-top: 0;
    }

    .reveal .callout {
      border-left: 6px solid #1769aa;
      padding: 0.45em 0.8em;
      background: #f4f8fc;
      text-align: left;
    }

    .reveal .warning {
      border-left: 6px solid #c67c00;
      padding: 0.45em 0.8em;
      background: #fff8eb;
      text-align: left;
    }

    .reveal .flow {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5em;
      flex-wrap: wrap;
      margin-top: 0.8em;
    }

    .reveal .flow .box {
      border: 2px solid #555;
      border-radius: 9px;
      padding: 0.35em 0.65em;
      min-width: 130px;
      background: #fff;
    }

    .reveal .flow .arrow {
      font-size: 1.25em;
      opacity: 0.7;
    }

    .reveal .branchline {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 0.55em;
      align-items: center;
      margin: 0.55em auto;
      width: 92%;
      text-align: left;
    }

    .reveal .branchlabel {
      font-weight: 700;
      text-align: right;
      padding-right: 0.35em;
    }

    .reveal .commits {
      display: flex;
      align-items: center;
      gap: 0.38em;
      flex-wrap: wrap;
    }

    .reveal .commit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      height: 48px;
      border: 2px solid #1769aa;
      border-radius: 50%;
      font-size: 0.52em;
      background: white;
    }

    .reveal .line {
      height: 3px;
      width: 44px;
      background: #777;
    }

    .reveal .state {
      border-radius: 12px;
      padding: 0.6em 0.7em;
      min-height: 90px;
      border: 2px solid #777;
      background: white;
    }

    .reveal table.compact {
      font-size: 0.64em;
    }

    .reveal table.compact th,
    .reveal table.compact td {
      padding: 0.23em 0.42em;
    }

    .reveal pre { width: 96%; }
    .reveal pre code { max-height: 480px; }

    .reveal .image-wide {
      max-width: 92%;
      max-height: 470px;
      object-fit: contain;
    }

    .reveal .image-medium {
      max-width: 78%;
      max-height: 440px;
      object-fit: contain;
    }

    .reveal .image-small {
      max-width: 55%;
      max-height: 410px;
      object-fit: contain;
    }

    .reveal .source-link {
      margin-top: 0.35em;
      font-size: 0.40em;
      opacity: 0.62;
    }

    /* PDF / print helpers
       Use in slides.md:
       <div class="screen-only">...</div>  -> shown in presentation
       <div class="print-only">...</div>   -> shown only in PDF/print
    */
    .print-only {
      display: none;
    }

    @media print {
      body {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .screen-only {
        display: none !important;
      }

      .print-only {
        display: block !important;
      }

      /* Keep replacement screenshots/images within one PDF page. */
      .print-only img {
        max-width: 95%;
        max-height: 72vh;
        object-fit: contain;
      }
    }

    @media (max-width: 900px) {
      .reveal .two-col,
      .reveal .three-col,
      .reveal .four-col {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="reveal">
    <div class="slides">
      <section
        data-markdown="slides.md"
        data-separator="^\r?\n---\r?\n$"
        data-separator-vertical="^\r?\n--\r?\n$"
        data-separator-notes="^Note:"
      ></section>
    </div>
  </div>

  <!-- Reveal.js -->
  <script src="https://unpkg.com/reveal.js@6.0.1/dist/reveal.js"></script>

  <!-- Reveal.js plugins -->
  <script src="https://unpkg.com/reveal.js@6.0.1/dist/plugin/markdown.js"></script>
  <script src="https://unpkg.com/reveal.js@6.0.1/dist/plugin/highlight.js"></script>
  <script src="https://unpkg.com/reveal.js@6.0.1/dist/plugin/notes.js"></script>
  <script src="https://unpkg.com/reveal.js@6.0.1/dist/plugin/search.js"></script>
  <script src="https://unpkg.com/reveal.js@6.0.1/dist/plugin/zoom.js"></script>
  <script src="https://unpkg.com/reveal.js@6.0.1/dist/plugin/math.js"></script>

  <script>
    Reveal.initialize({
      hash: true,
      slideNumber: 'c/t',
      transition: 'slide',
      center: true,

      /* PDF export: open the presentation with ?print-pdf and print from Chrome/Chromium.
         Fragments are combined on one PDF page instead of creating one page per reveal step. */
      pdfSeparateFragments: false,
      pdfMaxPagesPerSlide: 1,

      plugins: [
        RevealMarkdown,
        RevealHighlight,
        RevealNotes,
        RevealSearch,
        RevealZoom,
        RevealMath.KaTeX
      ]
    });
  </script>
</body>
</html>
